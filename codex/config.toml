# Portable preferences. Keep machine-specific settings in the active config.

model_reasoning_effort = "high"

[features]
hooks = true
js_repl = false

[tui]
status_line = ["model-with-reasoning", "current-dir", "thread-name", "context-remaining", "five-hour-limit", "weekly-limit"]
theme = "dracula"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
sansFontSize = 14
codeFontSize = 13
ambient-suggestions-enabled = true
followUpQueueMode = "queue"
